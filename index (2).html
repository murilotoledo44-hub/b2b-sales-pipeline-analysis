<style>
/* ============ EDIT ME: settings live in the CONFIG object in the script below ============ */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6B82; --line:#DCE2EA;
  --accent:#2346D8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --font:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#151F33; --ink:#E8EDF5; --muted:#95A3BA; --line:#26324A;
    --accent:#8198FF; --accent-ink:#0E1524; --accent-soft:#1D2A4D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#151F33; --ink:#E8EDF5; --muted:#95A3BA; --line:#26324A;
  --accent:#8198FF; --accent-ink:#0E1524; --accent-soft:#1D2A4D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{font-weight:700;text-decoration:none;letter-spacing:-.01em;margin-right:auto}
.nav{display:flex;gap:20px}
.nav a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500}
.nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:720px){.nav{display:none}}

/* Hero */
.hero{padding-block:72px 56px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:0 0 20px}
.status i{width:8px;height:8px;border-radius:50%;background:#1FA56B;box-shadow:0 0 0 4px color-mix(in srgb,#1FA56B 20%,transparent)}
h1{font-size:clamp(2.3rem,5vw,3.6rem);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 0 20px}
.lede{font-size:1.15rem;color:var(--muted);max-width:34em;margin:0 0 32px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:16px;padding:13px 20px;border-radius:10px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-ghost:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px}

/* Funnel — the signature element */
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.funnel h2{font-size:15px;font-weight:600;margin:0 0 4px}
.funnel .sub{font-size:14px;color:var(--muted);margin:0 0 22px}
.stage{margin-bottom:14px}
.stage:last-child{margin-bottom:0}
.stage .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:6px}
.stage .row b{font-weight:700;font-size:15px;white-space:nowrap}
.stage .row span{color:var(--muted)}
.track{height:34px;border-radius:8px;background:var(--accent-soft);overflow:hidden}
.fill{height:100%;width:0;border-radius:8px;background:var(--accent);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stage:nth-child(3) .fill{opacity:.85}.stage:nth-child(4) .fill{opacity:.7}.stage:nth-child(5) .fill{opacity:1}
@media (prefers-reduced-motion:reduce){.fill{transition:none}html{scroll-behavior:auto}}

/* Sections */
section.block{padding:64px 0;border-top:1px solid var(--line)}
.block-head{display:grid;grid-template-columns:260px 1fr;gap:40px}
.block-head h2{font-size:1.6rem;letter-spacing:-.02em;line-height:1.2;margin:0}
.block-head .intro{color:var(--muted);margin:8px 0 0;font-size:15px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:40px;padding-top:48px}.block-head{grid-template-columns:1fr;gap:20px}}

.about p{margin:0 0 16px;max-width:38em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:0;list-style:none}
.facts li{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}

/* Timeline (a real sequence) */
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 32px 28px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.timeline li:first-child::before{background:var(--accent)}
.timeline h3{margin:0;font-size:1.1rem}
.timeline .meta{font-size:14px;color:var(--muted);margin:2px 0 8px}
.timeline p{margin:0;max-width:38em}

/* Projects */
.projects{display:grid;gap:16px}
.project{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px}
.project .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.project h3{margin:0;font-size:1.15rem}
.tag{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.project p{margin:10px 0 0;color:var(--muted);max-width:40em}
.project .links{margin-top:14px;display:flex;gap:16px;font-size:15px;font-weight:600}
.project .links a{color:var(--accent);text-decoration:none}
.project .links a:hover{text-decoration:underline}

/* Skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px}
.skills h3{font-size:15px;margin:0 0 10px}
.skills ul{margin:0;padding:0;list-style:none}
.skills li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.skills li small{color:var(--muted);font-size:13px;margin-left:6px}

/* Contact */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.contact-grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px}
.card h3{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0 0 18px;color:var(--muted);font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.direct{margin-top:16px;font-size:15px}
.direct a{color:var(--accent);font-weight:600}

/* Small phones: keep the intro comfortably inside the screen */
h1,.lede,.status{overflow-wrap:break-word;hyphens:auto}
@media (max-width:480px){
  .wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .bar .wrap{gap:12px;height:56px}
  .brand{font-size:15px}
  .lang button{padding:4px 8px}
  .hero{padding-block:32px 40px;gap:32px}
  .status{font-size:13px;align-items:flex-start;line-height:1.4}
  .status i{flex:none;margin-top:5px}
  h1{font-size:1.95rem;line-height:1.1;letter-spacing:-.025em}
  .lede{font-size:1.02rem;margin-bottom:24px}
  .ctas .btn{flex:1 1 100%;justify-content:center}
  .funnel{padding:20px}
  section.block{padding:48px 0}
  .block-head h2{font-size:1.4rem}
}

footer{padding:32px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted)}
</style>
</head>

let lang = "en";
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || "";

function mailto(subject, body){
  return "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

function renderProjects(){
  const list = document.getElementById("project-list");
  list.innerHTML = "";
  PROJECTS.forEach(p => {
    const el = document.createElement("article");
    el.className = "project";
    const top = document.createElement("div"); top.className = "top";
    const h = document.createElement("h3"); h.textContent = p.title[lang] || p.title.en;
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = p.tag[lang] || p.tag.en;
    top.append(h, tag);
    const d = document.createElement("p"); d.textContent = p.desc[lang] || p.desc.en;
    el.append(top, d);
    if (p.links && p.links.length){
      const l = document.createElement("div"); l.className = "links";
      p.links.forEach(x => { const a = document.createElement("a"); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = x.label[lang] || x.label.en; l.append(a); });
      el.append(l);
    }
    list.append(el);
  });
}

function applyLang(next){
  lang = I18N[next] ? next : "en";
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const book = CONFIG.bookingUrl || mailto(t("form.bookSubject"), t("form.bookBody"));
  ["book-hero","book-card"].forEach(id => {
    const a = document.getElementById(id);
    a.href = book;
    if (!CONFIG.bookingUrl){ a.removeAttribute("target"); }
  });
  renderProjects();
  try { localStorage.setItem("portfolio-lang", lang); } catch(e) {}
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

document.getElementById("send").addEventListener("click", () => {
  const name = document.getElementById("f-name").value.trim();
  const company = document.getElementById("f-company").value.trim();
  const msg = document.getElementById("f-msg").value.trim();
  const hint = document.querySelector("#contact-form .hint");
  if (!name || !msg){ hint.textContent = t("form.error"); hint.style.color = "var(--accent)"; return; }
  hint.textContent = t("form.hint"); hint.style.color = "";
  const subject = t("form.subject") + (company ? " — " + company : "");
  const body = msg + "\n\n— " + name + (company ? ", " + company : "");
  window.location.href = mailto(subject, body);
});

// Static bits
const emailLink = document.getElementById("email-link");
emailLink.textContent = CONFIG.email; emailLink.href = "mailto:" + CONFIG.email;
document.getElementById("year").textContent = new Date().getFullYear();
const social = document.getElementById("social");
[["LinkedIn", CONFIG.linkedin], ["GitHub", CONFIG.github]].forEach(([label, url]) => {
  if (!url) return;
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = label;
  if (social.childNodes.length) social.append(document.createTextNode("  ·  "));
  social.append(a);
});

// Initial language: saved choice, else browser language, else English
let initial = "en";
try { initial = localStorage.getItem("portfolio-lang") || ""; } catch(e) { initial = ""; }
if (!initial){ const nav = (navigator.language || "en").slice(0,2); initial = I18N[nav] ? nav : "en"; }
applyLang(initial);

// One orchestrated moment: the funnel fills on load
requestAnimationFrame(() => setTimeout(() => {
  document.querySelectorAll(".stage").forEach((s, i) => {
    const f = s.querySelector(".fill");
    f.style.transitionDelay = (i * 140) + "ms";
    f.style.width = s.dataset.w + "%";
  });
}, 120));
</script>
